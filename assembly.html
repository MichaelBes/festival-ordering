<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assembly — St. George Festival</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body class="kitchen">
  <div class="glow-bar"></div>
  <div class="topbar">
    <h1>Assembly</h1>
    <div class="subtitle" id="clock"></div>
  </div>

  <div class="board">
    <div class="col-heading">Put Together <span class="count" id="queueCount">0</span></div>
    <div id="queueList"></div>
  </div>

  <!-- Shown only when an order needs both kitchens, so it's clear
       which portion(s) are being sent back before anything happens. -->
  <div class="modal-backdrop" id="sendBackModal" style="display:none;">
    <div class="modal">
      <h2>Send Back to Which Kitchen?</h2>
      <p>This order has items from more than one kitchen.</p>
      <div id="sendBackChoices"></div>
      <div class="cancel-link" id="sendBackCancelBtn">Cancel</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    let ordersState = [];
    let pendingUpdates = {}; // orderId -> status we've optimistically set but not yet confirmed
    let knownOrderIds = new Set();
    let firstLoad = true;

    let audioCtx = null;
    document.body.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    function playChime() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function timeAgo(ts) {
      const mins = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
      if (mins < 1) return 'just now';
      return mins + ' min ago';
    }

    function orderCardHtml(o) {
      // Full order — every item, from both kitchens — so whoever's
      // assembling it can see the whole picture.
      const items = o.items || [];
      return `
        <div class="order-card status-in_progress" data-id="${o.orderId}">
          <div class="order-card-top">
            <span>
              ${o.customerName ? `<span class="order-name">${o.customerName}</span>` : ''}
              <span class="order-id">${o.orderId}</span>
              ${o.paymentMethod === 'cash' ? '<span class="order-tag">CASH</span>' : ''}${o.station === 'online' ? '<span class="order-tag">ONLINE</span>' : ''}
            </span>
            <span class="order-top-right">
              <span class="order-elapsed">${timeAgo(o.timestamp)}</span>
              <button class="btn-send-back" data-id="${o.orderId}" title="Send back to kitchen">↩ Send Back</button>
            </span>
          </div>
          ${o.notes ? `<div class="order-notes-alert">⚠️ ${o.notes}</div>` : ''}
          <ul class="order-items-list">
            ${items.map(i => `<li>${i.qty}× ${i.name}${i.options ? ` <span class="order-tag">${i.options}</span>` : ''} <span class="history-meta">(${i.kitchen})</span></li>`).join('')}
          </ul>
          <div class="order-actions">
            <button class="btn-ready" data-id="${o.orderId}">Mark Ready</button>
          </div>
        </div>
      `;
    }

    function render() {
      const queue = ordersState.filter(o => o.status === 'in_progress');
      document.getElementById('queueCount').textContent = queue.length;
      document.getElementById('queueList').innerHTML = queue.length
        ? queue.map(orderCardHtml).join('')
        : '<div class="empty-state">Nothing waiting on assembly</div>';
    }

    async function refresh() {
      try {
        const data = await fetchOrders('');
        const currentIds = new Set(data.orders.map(o => o.orderId));
        if (!firstLoad) {
          const isNew = [...currentIds].some(id => !knownOrderIds.has(id));
          if (isNew) playChime();
        }
        knownOrderIds = currentIds;
        firstLoad = false;

        ordersState = data.orders;
        ordersState.forEach(o => {
          if (pendingUpdates[o.orderId]) o.status = pendingUpdates[o.orderId];
        });
        render();
      } catch (err) {
        console.error('Refresh failed', err);
      }
    }

    let sendBackOrderId = null;

    // Smoothies are handled entirely on their own screen (order →
    // tap to mark picked up) and never touch Assembly at all, so this
    // deliberately only lists the two kitchens Assembly actually deals
    // with.
    const ALL_KITCHENS = [
      { key: 'main', label: 'Main Kitchen' },
      { key: 'sandwich', label: 'Sandwich Kitchen' },
    ];

    function neededKitchensFor(order) {
      return ALL_KITCHENS.filter(k => order['needs' + k.key[0].toUpperCase() + k.key.slice(1)]);
    }

    // Whether the order would still have something started (and so
    // should stay visible on Assembly) after sending back the given
    // kitchen(s) — a partial send-back on a multi-kitchen order
    // shouldn't make the order vanish if another side is still done.
    function willStayInProgress(order, kitchens) {
      return ALL_KITCHENS.some(k => {
        const startedField = k.key + 'Started';
        const isBeingSentBack = kitchens.includes(k.key);
        return isBeingSentBack ? false : !!order[startedField];
      });
    }

    async function performSendBack(orderId, kitchens) {
      const order = ordersState.find(o => o.orderId === orderId);
      if (!order) return;

      const staysVisible = willStayInProgress(order, kitchens);
      kitchens.forEach(k => { order[k + 'Started'] = false; });
      if (!staysVisible) {
        ordersState = ordersState.filter(o => o.orderId !== orderId);
      }
      render();

      try {
        await sendBackToKitchen(orderId, kitchens);
        if (staysVisible) refresh();
      } catch (err) {
        alert('Could not send that order back — please try again.');
        refresh();
      }
    }

    function hideSendBackModal() {
      document.getElementById('sendBackModal').style.display = 'none';
      document.getElementById('sendBackChoices').innerHTML = '';
      sendBackOrderId = null;
    }

    function openSendBackModal(order) {
      sendBackOrderId = order.orderId;
      const needed = neededKitchensFor(order);
      const choicesEl = document.getElementById('sendBackChoices');
      let html = needed.map(k =>
        `<button class="kitchen-choice-btn" data-kitchens="${k.key}">${k.label} Only</button>`
      ).join('');
      html += `<button class="kitchen-choice-btn" data-kitchens="${needed.map(k => k.key).join(',')}">All (${needed.map(k => k.label).join(', ')})</button>`;
      choicesEl.innerHTML = html;
      document.getElementById('sendBackModal').style.display = 'flex';
    }

    document.getElementById('sendBackChoices').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-kitchens]');
      if (!btn) return;
      const id = sendBackOrderId;
      const kitchens = btn.dataset.kitchens.split(',');
      hideSendBackModal();
      performSendBack(id, kitchens);
    });
    document.getElementById('sendBackCancelBtn').addEventListener('click', hideSendBackModal);

    document.getElementById('queueList').addEventListener('click', async (e) => {
      const readyBtn = e.target.closest('button.btn-ready');
      const sendBackBtn = e.target.closest('button.btn-send-back');
      const btn = readyBtn || sendBackBtn;
      if (!btn) return;
      const orderId = btn.dataset.id;
      const order = ordersState.find(o => o.orderId === orderId);
      if (!order) return;

      if (sendBackBtn) {
        const needed = neededKitchensFor(order);
        if (needed.length > 1) {
          // Ambiguous — could be any of several kitchens' mistake, so ask.
          openSendBackModal(order);
          return;
        }
        const only = needed[0];
        if (!only) return;
        if (!confirm(`Send this order back to ${only.label}? This undoes "Start."`)) return;
        performSendBack(orderId, [only.key]);
        return;
      }

      // Warn (but don't hard-block) if one of the kitchens this order
      // needs hasn't actually started their part yet — easy to miss
      // when an order shows up here as soon as just one kitchen starts.
      const notStarted = neededKitchensFor(order).find(k => !order[k.key + 'Started']);
      if (notStarted) {
        if (!confirm(`${notStarted.label} hasn't started this order yet. Mark it ready anyway?`)) return;
      }

      pendingUpdates[orderId] = 'ready';
      order.status = 'ready';
      render();

      try {
        await updateOrderStatus(orderId, 'ready');
        delete pendingUpdates[orderId];
      } catch (err) {
        delete pendingUpdates[orderId];
        order.status = 'in_progress';
        render();
        alert('Could not mark that order ready — please try again.');
      }
    });

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    updateClock();
    setInterval(updateClock, 30000);
    refresh();
    setInterval(refresh, POLL_INTERVAL_MS);
  </script>
</body>
</html>
