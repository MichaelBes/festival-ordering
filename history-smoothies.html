<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smoothie Orders — St. George Festival</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow-bar"></div>
  <div class="topbar">
    <h1>Smoothie Orders</h1>
    <a class="history-link" href="kitchen-smoothies.html">← Back</a>
  </div>

  <div class="history-search-bar">
    <input type="text" id="searchInput" placeholder="Search by name or order number (e.g. Mina or S1-014)" autocomplete="off">
  </div>

  <div class="history-list" id="historyList">
    <div class="empty-state">Loading orders...</div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    let allOrders = [];

    const STATUS_LABEL = {
      received: 'Received', in_progress: 'In Progress',
      ready: 'Ready', completed: 'Picked Up',
      awaiting_payment: 'Awaiting Payment', failed: 'Payment Failed',
    };

    function cardHtml(o) {
      const items = (Array.isArray(o.items) ? o.items : []).filter(i => i.kitchen === 'smoothie');
      const subtotal = items.reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.qty) || 0), 0);
      const time = new Date(o.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const pillClass = o.smoothieStarted ? 'completed' : 'ready';
      const pillLabel = o.smoothieStarted ? 'Picked Up' : 'Ready to Hand Off';
      return `
        <div class="history-card">
          <div class="history-card-top">
            <span>
              <span class="order-name">${o.customerName || '—'}</span>
              <span class="order-id">${o.orderId}</span>
            </span>
            <span class="status-pill ${pillClass}">${pillLabel}</span>
          </div>
          <ul class="order-items-list">
            ${items.map(i => `<li>${i.qty}× ${i.name}${i.options ? ` <span class="order-tag">${i.options}</span>` : ''}</li>`).join('')}
          </ul>
          <div class="history-meta">${time} · $${subtotal.toFixed(2)} · ${o.paymentMethod === 'cash' ? 'Cash' : 'Card'} · ${o.station === 'online' ? 'Online Order' : 'Station ' + o.station}</div>
          ${o.smoothieStarted ? `<button class="undo-pickup-btn" data-order-id="${o.orderId}">Accidentally picked up? Undo</button>` : ''}
        </div>
      `;
    }

    async function handleUndoPickup(orderId, btn) {
      if (!confirm(`Send this smoothie order back to the Smoothies screen?`)) return;
      btn.disabled = true;
      btn.textContent = 'Undoing...';
      try {
        const result = await undoSmoothiePickup(orderId);
        if (!result.success) throw new Error(result.error || 'Could not undo pickup');
        const order = allOrders.find(o => o.orderId === orderId);
        if (order) order.smoothieStarted = false;
        render();
      } catch (err) {
        alert('Could not undo pickup — ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Accidentally picked up? Undo';
      }
    }

    document.getElementById('historyList').addEventListener('click', (e) => {
      const undoPickupBtn = e.target.closest('.undo-pickup-btn');
      if (undoPickupBtn) { handleUndoPickup(undoPickupBtn.dataset.orderId, undoPickupBtn); return; }
    });

    function render() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('historyList');

      const filtered = query
        ? allOrders.filter(o =>
            (o.customerName || '').toLowerCase().includes(query) ||
            o.orderId.toLowerCase().includes(query))
        : allOrders;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">${query ? 'No matching orders' : 'No orders yet'}</div>`;
        return;
      }
      listEl.innerHTML = filtered.map(cardHtml).join('');
    }

    async function load() {
      try {
        const data = await fetchHistory();
        allOrders = data.orders.filter(o => (o.items || []).some(i => i.kitchen === 'smoothie')); // already newest-first from the backend
        render();
      } catch (err) {
        document.getElementById('historyList').innerHTML = '<div class="empty-state">Couldn\'t load orders. Check your connection.</div>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', render);

    load();
  </script>
</body>
</html>
